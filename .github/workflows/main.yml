name: FloppyKernel – Build Matrix

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target Device(s)'
        required: true
        default: 'separate'
        type: choice
        options:
          - separate  # Ginkgo + Laurel as separate jobs
          - unified   # Mitrinket unified build
          - ginkgo    # Redmi Note 8/8T only
          - laurel    # Xiaomi Mi A3 only

      build_variant:
        description: 'Build Variant(s)'
        required: true
        default: 'all'
        type: choice
        options:
          - all      # Vanilla + KSUNext + SukiSU + RKSU
          - vanilla  # Vanilla only
          - ksu      # KernelSU-Next only
          - sukisu   # ReSukiSU-SUSFS only
          - rksu     # RKSU only

      compiler_type:
        description: 'Compiler Toolchain'
        required: true
        default: 'aosp_clang'
        type: choice
        options:
          - aosp_clang   # AOSP Clang mirror (stable)
          - llvm_latest  # Bleeding-edge upstream LLVM

      create_release:
        description: 'Publish GitHub Release'
        required: false
        default: 'true'
        type: boolean

  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: floppy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL ENV – every job/step inherits these
# ─────────────────────────────────────────────────────────────────────────────
env:
  # WP must be workspace root so that ckbuild.sh's `cat ../x` resolves correctly.
  WP: ${{ github.workspace }}

  # CLANG_TYPE=custom tells ckbuild.sh to skip re-downloading and use CUST_DIR.
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/custom-toolchain
  CLANG_TYPE: custom
  CUST_DIR:   ${{ github.workspace }}/toolchains/custom-toolchain

  # ckbuild.sh only sets CCACHE_DIR when IS_GP==1 (Gitpod).
  # Exporting here ensures CI (IS_GP=0) also gets a valid ccache directory.
  CCACHE_DIR:  ${{ github.workspace }}/.ccache
  CCACHE_SIZE: "12G"
  USE_CCACHE:  "1"

  # ckbuild.sh only sets KBUILD_* inside IS_GP==1; export here for CI identity.
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: floppy-ci

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 1 – CONFIGURE
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  configure:
    name: ⚙️ Strategy Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix:   ${{ steps.set-matrix.outputs.matrix }}
      compiler: ${{ steps.set-vars.outputs.compiler }}
      variants: ${{ steps.set-matrix.outputs.variants }}

    steps:
      - name: Compute Build Matrix
        id: set-matrix
        run: |
          # ── Resolve trigger source ──────────────────────────────────────────
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.build_target }}"
            VARIANT_INPUT="${{ inputs.build_variant }}"
          else
            # push event: build all devices × all variants
            TARGET="separate"
            VARIANT_INPUT="all"
          fi

          echo "::group::Matrix Resolution"
          echo "Event   : ${{ github.event_name }}"
          echo "Target  : $TARGET"
          echo "Variant : $VARIANT_INPUT"

          # ── Device list ─────────────────────────────────────────────────────
          case "$TARGET" in
            unified)  DEVICES='["mitrinket"]' ;;
            separate) DEVICES='["ginkgo","laurel_sprout"]' ;;
            ginkgo)   DEVICES='["ginkgo"]' ;;
            laurel)   DEVICES='["laurel_sprout"]' ;;
            *)        DEVICES='["ginkgo","laurel_sprout"]' ;;
          esac

          # ── Variant list ────────────────────────────────────────────────────
          case "$VARIANT_INPUT" in
            all)     VARIANTS='["Vanilla","KSUNext","SukiSU","RKSU"]' ;;
            vanilla) VARIANTS='["Vanilla"]' ;;
            ksu)     VARIANTS='["KSUNext"]' ;;
            sukisu)  VARIANTS='["SukiSU"]' ;;
            rksu)    VARIANTS='["RKSU"]' ;;
            *)       VARIANTS='["Vanilla","KSUNext","SukiSU","RKSU"]' ;;
          esac

          echo "Devices  : $DEVICES"
          echo "Variants : $VARIANTS"
          echo "::endgroup::"

          echo "matrix={\"device\":$DEVICES,\"variant\":$VARIANTS}" >> "$GITHUB_OUTPUT"
          # Also expose variants string for the release notes step
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"

      - name: Resolve Compiler Label
        id: set-vars
        run: |
          echo "compiler=${{ inputs.compiler_type || 'aosp_clang' }}" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 2 – BUILD  (device × variant matrix)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.device }} • ${{ matrix.variant }}
    needs: configure
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:

      # ── 1. Free disk space ──────────────────────────────────────────────────
      - name: 🗑️ Free Disk Space
        run: |
          echo "── Disk before ──"; df -h /
          sudo rm -rf \
            /usr/share/dotnet            \
            /usr/local/lib/android       \
            /opt/ghc                     \
            /opt/hostedtoolcache/CodeQL  \
            /usr/local/share/boost       \
            /usr/lib/jvm                 \
            "${AGENT_TOOLSDIRECTORY:-}"
          sudo apt-get clean
          echo "── Disk after ──"; df -h /

      # ── 2. Fix swap ─────────────────────────────────────────────────────────
      # ubuntu-22.04 runners boot with a 4 GB /swapfile already swapon'd.
      # fallocate refuses to touch an active swap file → swapoff first.
      - name: 🧠 Configure Swap (12 GB)
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile

          sudo fallocate -l 12G /mnt/swapfile \
            || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288 status=progress

          sudo chmod 600  /mnt/swapfile
          sudo mkswap     /mnt/swapfile
          sudo swapon     /mnt/swapfile
          free -h; swapon --show

      # ── 3. Checkout kernel ──────────────────────────────────────────────────
      # path: kernel  so that:
      #   • `[[ ! -d drivers ]]` check in ckbuild.sh passes
      #   • ../bot_token from inside kernel/ resolves to $WP/bot_token
      #   • do_build.sh's WP=${WP:-$(realpath "${PWD}/../")} = workspace root
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      # ── 4. Write credential files ───────────────────────────────────────────
      - name: 🔑 Write Credential Files
        run: |
          printf '%s' "${{ secrets.TELEGRAM_BOT_TOKEN }}"    > "$WP/bot_token"
          printf '%s' "${{ secrets.TELEGRAM_CHAT_ID }}"      > "$WP/chat"
          printf '%s' "${{ secrets.TELEGRAM_TEST_CHAT_ID }}" > "$WP/chat_test"

      # ── 5. Install dependencies ─────────────────────────────────────────────
      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison binutils build-essential ca-certificates ccache cpio \
            curl device-tree-compiler file flex git jq kmod \
            libelf-dev libssl-dev libtinfo5 lz4 lzop python3 wget zip zstd

      # ── 6. Resolve toolchain URL ────────────────────────────────────────────
      - name: 🔗 Resolve Toolchain URL
        id: toolchain-url
        env:
          COMPILER_TYPE: ${{ needs.configure.outputs.compiler }}
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::Resolving URL for $COMPILER_TYPE"

          if [ "$COMPILER_TYPE" = "llvm_latest" ]; then
            SRC="https://raw.githubusercontent.com/PurrrsLitterbox/LLVM-weekly/main/latestlink.txt"
            for i in 1 2 3 4 5; do
              LINK=$(curl -fsSL --retry 3 --retry-delay 2 "$SRC" 2>/dev/null | tr -d '[:space:]')
              if [ -n "$LINK" ] && [[ "$LINK" == http* ]]; then
                break
              fi
              echo "Retry $i/5..."
              sleep 5
            done
          else
            # aosp_clang: fetch from GitHub releases mirror
            API="https://api.github.com/repos/Beethoven/aosp_clang_mirror/releases/latest"
            API_RESP=$(curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API")

            # Prefer clang-r*.tar.{gz,zst}; fall back to any tar archive
            LINK=$(echo "$API_RESP" | jq -r '
              .assets[] |
              select(.name | test("clang-r[0-9a-f]+\\.(tar\\.gz|tar\\.zst|tgz)$"; "i")) |
              .browser_download_url' | head -n1)

            if [ -z "$LINK" ] || [ "$LINK" = "null" ]; then
              LINK=$(echo "$API_RESP" | jq -r \
                '.assets[] | select(.name | endswith(".tar.gz") or endswith(".tar.zst")) | .browser_download_url' \
                | head -n1)
            fi
          fi

          if [ -z "${LINK:-}" ] || [ "$LINK" = "null" ]; then
            echo "::error::Failed to resolve toolchain URL for $COMPILER_TYPE"
            exit 1
          fi

          echo "URL: $LINK"
          CACHE_KEY=$(printf '%s' "$LINK" | sha256sum | cut -c1-16)
          echo "TOOLCHAIN_URL=$LINK"  >> "$GITHUB_ENV"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # ── 7. Cache toolchain ──────────────────────────────────────────────────
      - name: 💾 Cache Toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: tc-${{ needs.configure.outputs.compiler }}-${{ steps.toolchain-url.outputs.cache_key }}
          restore-keys: |
            tc-${{ needs.configure.outputs.compiler }}-

      # ── 8. Install toolchain (cache miss only) ──────────────────────────────
      #
      # ROOT CAUSE OF PREVIOUS FAILURE:
      #   `mkdir -p extracted` was only inside the elif/else branches.
      #   The zstandard branch called `tar -C extracted/` on a directory
      #   that did not yet exist, producing:
      #       tar: extracted: Cannot open: No such file or directory
      #
      # FIX: `mkdir -p extracted` is now unconditional, before the
      #   format-detection block, so all three branches find the directory.
      #
      - name: 🛠️ Install Toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$TOOLCHAIN_DIR"
          TC_TMP=$(mktemp -d)
          cd "$TC_TMP"

          echo "Downloading toolchain..."
          wget --tries=5 --timeout=120 --progress=dot:giga -O tc_archive "$TOOLCHAIN_URL"

          if [ ! -f tc_archive ] || [ ! -s tc_archive ]; then
            echo "::error::Download failed or file is empty"
            exit 1
          fi

          echo "Detecting archive format..."
          FTYPE=$(file -b tc_archive)
          echo "File type: $FTYPE"

          # ── FIX: create extraction directory unconditionally ────────────────
          mkdir -p extracted

          # Extract based on detected format
          if echo "$FTYPE" | grep -qi "zstandard"; then
            # Try native --zstd first (GNU tar ≥ 1.31), fall back to -I zstd
            tar --zstd -xf tc_archive -C extracted/ \
              || tar -I zstd -xf tc_archive -C extracted/
          elif echo "$FTYPE" | grep -qi "gzip"; then
            tar -xzf tc_archive -C extracted/
          elif echo "$FTYPE" | grep -qi "bzip2"; then
            tar -xjf tc_archive -C extracted/
          elif echo "$FTYPE" | grep -qi "XZ"; then
            tar -xJf tc_archive -C extracted/
          else
            tar -xf tc_archive -C extracted/
          fi

          # Find the toolchain root (directory that contains bin/clang)
          echo "Searching for clang binary..."
          BIN=$(find extracted -type f -name "clang" | grep "/bin/clang$" | head -n1)

          if [ -z "$BIN" ]; then
            echo "::error::bin/clang not found in archive. Top-level contents:"
            find extracted -maxdepth 3 -type d | head -20
            exit 1
          fi

          EXTRACTED_ROOT=$(dirname "$(dirname "$BIN")")
          echo "Found toolchain root: $EXTRACTED_ROOT"

          # Install into TOOLCHAIN_DIR
          rm -rf "${TOOLCHAIN_DIR:?}"/*
          cp -a "$EXTRACTED_ROOT"/. "$TOOLCHAIN_DIR/"

          # Verify
          if [ ! -f "$TOOLCHAIN_DIR/bin/clang" ]; then
            echo "::error::Installation verification failed – bin/clang missing"
            ls -la "$TOOLCHAIN_DIR/"
            exit 1
          fi

          cd /
          rm -rf "$TC_TMP"
          echo "Toolchain installed successfully"

      # ── 9. Verify toolchain ─────────────────────────────────────────────────
      - name: ✅ Verify Toolchain
        run: |
          "$TOOLCHAIN_DIR/bin/clang" --version | head -n1

      # ── 10. Restore ccache ──────────────────────────────────────────────────
      - name: ♻️ Restore CCache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.device }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ matrix.variant }}-
            ccache-${{ matrix.device }}-

      # ── 11. Configure ccache ────────────────────────────────────────────────
      # ckbuild.sh only runs `ccache -M` inside IS_GP==1 (Gitpod).
      # On CI IS_GP=0, so we configure it here; CCACHE_DIR is inherited.
      - name: ⚡ Configure CCache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_SIZE"               2>/dev/null \
            || ccache -M "$CCACHE_SIZE"
          ccache --set-config=compression=true                       2>/dev/null || true
          ccache --set-config=compression_level=1                    2>/dev/null || true
          ccache --set-config=hash_dir=false                         2>/dev/null || true
          ccache --set-config=sloppiness=include_file_ctime,include_file_mtime \
            2>/dev/null || true
          ccache -z

      # ── 12. Build ───────────────────────────────────────────────────────────
      # working-directory: kernel is critical – ckbuild.sh checks for `drivers/`
      # and resolves `../bot_token` from this directory.
      - name: 🔨 Build Kernel (${{ matrix.device }} • ${{ matrix.variant }})
        working-directory: kernel
        run: |
          # Map variant label to ckbuild.sh flag
          case "${{ matrix.variant }}" in
            Vanilla) FLAG=""  ;;
            KSUNext) FLAG="k" ;;
            SukiSU)  FLAG="s" ;;
            RKSU)    FLAG="u" ;;
            *)
              echo "::error::Unknown variant: ${{ matrix.variant }}"
              exit 1
              ;;
          esac

          echo "::group::Build Manifest"
          echo "Device   : ${{ matrix.device }}"
          echo "Variant  : ${{ matrix.variant }}  (flag='${FLAG}')"
          echo "Compiler : $CLANG_TYPE  →  $CUST_DIR"
          echo "WP       : $WP"
          echo "::endgroup::"

          ulimit -s unlimited
          chmod +x do_build.sh ckbuild.sh

          ./do_build.sh "${{ matrix.device }}" "$FLAG" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build-${{ matrix.device }}-${{ matrix.variant }}.log"

      # ── 13. CCache statistics ───────────────────────────────────────────────
      - name: 📊 CCache Statistics
        if: always()
        run: ccache -s

      # ── 14. Process logs ────────────────────────────────────────────────────
      - name: 🔍 Process Build Log
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/build-${{ matrix.device }}-${{ matrix.variant }}.log"
          [ -f "$LOG" ] || exit 0
          grep -nEi 'error:'   "$LOG" > "$GITHUB_WORKSPACE/errors.log"   || true
          grep -nEi 'warning:' "$LOG" > "$GITHUB_WORKSPACE/warnings.log" || true

      # ── 15. Stage artifacts ─────────────────────────────────────────────────
      # ZIP_PATH in ckbuild.sh = "$WP/Floppy_${FK_VER}-${CK_TYPE}-${CODENAME}-${DATE}.zip"
      # With WP = workspace root, zips land at $GITHUB_WORKSPACE/Floppy_*.zip
      - name: 📦 Stage Kernel ZIP
        id: stage
        if: success()
        run: |
          mkdir -p release_artifacts
          shopt -s nullglob
          ZIPS=("$WP"/Floppy_*.zip)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::warning::No Floppy_*.zip found under $WP"
            echo "zip_found=false" >> "$GITHUB_OUTPUT"
          else
            cp -v "${ZIPS[@]}" release_artifacts/
            echo "zip_found=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 16. Upload logs ─────────────────────────────────────────────────────
      - name: 📋 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.device }}-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            build-${{ matrix.device }}-${{ matrix.variant }}.log
            errors.log
            warnings.log
          if-no-files-found: ignore
          retention-days: 7

      # ── 17. Upload kernel ZIP ───────────────────────────────────────────────
      - name: 📤 Upload Kernel ZIP
        if: steps.stage.outputs.zip_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-${{ matrix.variant }}-${{ github.run_number }}
          path: release_artifacts/*.zip
          compression-level: 0
          if-no-files-found: error

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 3 – RELEASE
# ─────────────────────────────────────────────────────────────────────────────
  create_release:
    name: 🚀 Publish Release
    needs: [configure, build]
    runs-on: ubuntu-22.04
    if: |
      success() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true') ||
        startsWith(github.ref, 'refs/tags/')
      )

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download All Kernel ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-*-${{ github.run_number }}
          merge-multiple: true
          path: artifacts

      - name: 🏷️ Rename Assets
        run: |
          mkdir -p final_assets
          DATE=$(date -u +%Y.%m.%d)

          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No kernel artifacts found"
            exit 1
          fi

          for f in artifacts/*.zip; do
            mv "$f" "final_assets/${DATE}-R${{ github.run_number }}-$(basename "$f")"
          done

          ls -lh final_assets/

      - name: 🚀 Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="FloppyKernel-R${{ github.run_number }}-$(date -u +%Y%m%d)"
          TITLE="FloppyKernel CI • Build #${{ github.run_number }}"

          # Build a human-readable variant list from what was actually requested
          VARIANT_INPUT="${{ inputs.build_variant || 'all' }}"
          case "$VARIANT_INPUT" in
            all)     VARIANT_LABEL="Vanilla · KSUNext · SukiSU · RKSU" ;;
            vanilla) VARIANT_LABEL="Vanilla" ;;
            ksu)     VARIANT_LABEL="KSUNext" ;;
            sukisu)  VARIANT_LABEL="SukiSU" ;;
            rksu)    VARIANT_LABEL="RKSU" ;;
            *)       VARIANT_LABEL="$VARIANT_INPUT" ;;
          esac

          NOTES="## Automated Build

          | Field | Value |
          |---|---|
          | Date | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | Target | \`${{ inputs.build_target || 'push-event' }}\` |
          | Variant(s) | \`${VARIANT_LABEL}\` |
          | Compiler | \`${{ inputs.compiler_type || 'aosp_clang' }}\` |
          | Commit | \`${{ github.sha }}\` |
          | Run | [\`#${{ github.run_number }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"

          gh release create "$TAG" \
            --title  "$TITLE" \
            --notes  "$NOTES" \
            --target "${{ github.sha }}" \
            final_assets/*.zip
